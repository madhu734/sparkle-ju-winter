<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="60%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#07080a" />
    </radialGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e2" />
      <stop offset="30%" stop-color="#dfba6b" />
      <stop offset="70%" stop-color="#c59b43" />
      <stop offset="100%" stop-color="#9a7123" />
    </linearGradient>

    <!-- Subtle Gold Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c59b43" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fff1cc" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="luxuryShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Luxury Squircle Outer Shell -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Hairline Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85" />

  <!-- Inner Concentric Frame -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35" />

  <!-- Geometric Corner Accents -->
  <path d="M 68 100 L 68 68 L 100 68" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7" />
  <path d="M 444 100 L 444 68 L 412 68" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7" />
  <path d="M 68 412 L 68 444 L 100 444" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7" />
  <path d="M 444 412 L 444 444 L 412 444" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7" />

  <!-- Central Crest / Monogram (T & L Intertwined) -->
  <g filter="url(#luxuryShadow)">
    <!-- Letter "T" (Majestic Serif Header & Vertical Stem) -->
    <!-- Top Horizontal Crossbar -->
    <path d="M 124 148 C 124 142 128 138 134 138 L 334 138 C 340 138 344 142 344 148 L 344 162 C 344 165 341 168 338 168 L 260 168 L 260 336 C 260 340 256 344 252 344 L 216 344 C 212 344 208 340 208 336 L 208 168 L 130 168 C 127 168 124 165 124 162 Z"
          fill="url(#goldGrad)" />

    <!-- "T" Top Left & Right Serif Brackets -->
    <path d="M 124 148 L 140 178 L 140 148 Z" fill="url(#goldGrad)" opacity="0.8" />
    <path d="M 344 148 L 328 178 L 328 148 Z" fill="url(#goldGrad)" opacity="0.8" />

    <!-- Letter "L" (Sleek Interlocking Modern Arm & Base) -->
    <!-- Vertical stem of L (offset to right, overlaps T) -->
    <path d="M 276 186 C 276 182 280 178 284 178 L 316 178 C 320 178 324 182 324 186 L 324 332 L 388 332 C 394 332 398 336 398 342 L 398 366 C 398 372 394 376 388 376 L 284 376 C 280 376 276 372 276 366 Z"
          fill="url(#glowGrad)" />

    <!-- "L" Terminal Finial / Upright Foot Accent -->
    <path d="M 398 342 L 378 316 L 398 316 Z" fill="url(#glowGrad)" opacity="0.85" />
  </g>

  <!-- Luxury Diamond Star Accent (Upper Right) -->
  <g transform="translate(372, 118)">
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Small Diamond Star Accent (Lower Left) -->
  <g transform="translate(138, 362) scale(0.65)">
    <path d="M 0 -20 Q 0 0 20 0 Q 0 0 0 20 Q 0 0 -20 0 Q 0 0 0 -20 Z" fill="url(#goldGrad)" opacity="0.75" />
  </g>

  <!-- Brand Typography: "THE LOOK" -->
  <g text-anchor="middle">
    <!-- Main Wordmark -->
    <text x="256" y="424"
          font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
          font-size="34"
          font-weight="700"
          letter-spacing="9"
          fill="url(#goldGrad)">
      THE LOOK
    </text>

    <!-- Subtitle Arch: "COLLEGIATE & BESPOKE" -->
    <text x="256" y="448"
          font-family="'Inter', system-ui, sans-serif"
          font-size="10.5"
          font-weight="600"
          letter-spacing="5"
          fill="#c59b43"
          opacity="0.8">
      EST. 2026 · WINTER CO.
    </text>
  </g>
</svg>
